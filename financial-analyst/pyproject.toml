[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analyst-ai"
version = "0.1.0"
description = "Personal Financial Analyst AI Assistant"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Financial Analyst AI", email = "user@example.com"}
]
dependencies = [
    "anthropic>=0.18.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "requests>=2.31.0",
    "python-telegram-bot>=20.0",
    "python-dateutil>=2.8.2",
    "yfinance>=0.2.0",
    "scipy>=1.11.0",
    "kaleido>=0.2.1",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
]

[project.scripts]
finai = "financial_analyst.cli:main"
finai-setup = "financial_analyst.setup:setup_wizard"
finai-alert = "financial_analyst.telegram_alerts:run_daily_alert"

[tool.setuptools.packages.find]
where = ["."]
include = ["financial_analyst*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
